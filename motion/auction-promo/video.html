<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Аукцион квартиры — все сценарии</title>
  <link rel="stylesheet" href="assets/prototype.css">
  <link rel="stylesheet" href="brand/brand.css">
  <link rel="stylesheet" href="base.css">
  <script src="plan.js"></script>
  <script src="assets/screens.js"></script>
  <script src="engine.js"></script>
  <style>
    :root { --bg:#f8faff; --surface:#f8faff; }
    #app { border-radius:0; box-shadow:none; background:#f8faff; }
    #app::after { content:''; position:absolute; left:1038px; top:0; width:882px; height:1080px; background:#edf2fb; z-index:0; }
    #editorial { position:absolute; left:88px; top:64px; width:872px; z-index:2; }
    .eyebrow { display:flex; align-items:center; gap:14px; color:#697797; font-size:17px; letter-spacing:.15em; font-weight:700; }
    .eyebrow i { width:32px; height:4px; background:#006cfd; border-radius:2px; }
    #headline { margin-top:42px; color:#0d162e; font-size:79px; line-height:.99; letter-spacing:-3.2px; font-weight:700; }
    #dek { margin-top:24px; font-size:24px; color:#697797; line-height:1.35; }
    #chapters { display:grid; gap:10px; margin-top:38px; }
    .chapter { width:850px; height:106px; display:flex; gap:22px; padding:18px 23px; border:1px solid transparent; border-radius:16px; background:transparent; }
    .chapter .number { font-size:20px; font-weight:700; color:#a0acca; padding-top:3px; width:28px; flex:none; }
    .chapter h2 { font-size:28px; letter-spacing:-.4px; line-height:1.15; font-weight:700; color:#697797; }
    .chapter p { margin-top:7px; font-size:21px; line-height:1.35; color:#8391af; }
    .chapter.active { background:#e6f0ff; border-color:#cde1ff; }
    .chapter.active h2, .chapter.active .number { color:#005ede; }
    .chapter.active p { color:#4f5c79; }
    .chapter.done .number { color:#697797; }
    #phase { position:absolute; left:1124px; top:69px; display:flex; align-items:center; gap:14px; font-size:17px; color:#697797; letter-spacing:.08em; font-weight:700; z-index:2; }
    #phase::before { content:''; width:8px; height:8px; border-radius:50%; background:#006cfd; }
    #counter { position:absolute; right:102px; top:67px; font-size:21px; font-weight:500; color:#8391af; font-variant-numeric:tabular-nums; z-index:2; }
    #viewport { position:absolute; left:1124px; top:128px; width:692px; height:842px; overflow:hidden; background:white; border:1px solid #dce4f1; border-radius:24px; box-shadow:0 16px 48px rgba(13,22,46,.06); z-index:2; }
    .screen { position:absolute; width:440px; height:920px; left:0; top:0; transform-origin:0 0; font:400 16px/1.5 Lato,Arial,sans-serif; color:var(--text-primary-default); background:#fff; }
    .screen > div { width:440px!important; min-height:920px!important; margin:0!important; box-shadow:none!important; border-radius:0!important; }
    .screen h1 { letter-spacing:-.5px; }
    .screen input { pointer-events:none; }
    .screen [class*="loader"] { animation:none!important; }
    .target { position:absolute; pointer-events:none; opacity:0; }
    #focus { position:absolute; border:2px solid #006cfd; border-radius:8px; box-shadow:0 0 0 5px rgba(0,108,253,.08); pointer-events:none; z-index:4; opacity:0; }
    #step { position:absolute; left:1124px; top:996px; width:692px; display:flex; align-items:center; justify-content:space-between; color:#697797; font-size:19px; z-index:2; }
    #step strong { color:#0d162e; font-weight:600; }
    #progress { position:absolute; left:88px; top:1011px; width:850px; height:4px; display:flex; gap:8px; z-index:2; }
    #progress span { position:relative; height:4px; background:#e1e6f4; border-radius:4px; overflow:hidden; }
    #progress i { display:block; width:100%; height:100%; background:#006cfd; transform-origin:left center; }
    #cursor { width:34px; height:34px; transform-origin:6px 4px; filter:drop-shadow(0 2px 2px rgba(13,22,46,.18)); }
    .rip { width:30px; height:30px; margin-left:-15px; margin-top:-15px; border-width:2px; }
  </style>
</head>
<body>
  <div id="frame">
    <div id="stage" class="layer"><div id="app">
      <div id="editorial">
        <div class="eyebrow"><i></i>ЦИАН · ПРОТОТИП</div>
        <div id="headline">Аукцион<br>квартиры</div>
        <p id="dek">Все сценарии — от условий до результата</p>
        <div id="chapters"></div>
      </div>
      <div id="phase"></div><div id="counter"></div>
      <div id="viewport"><div id="screens"></div><div id="focus"></div></div>
      <div id="step"><strong id="step-title"></strong><span id="step-count"></span></div>
      <div id="progress"></div>
    </div></div>
    <div id="stage2" class="layer"><div id="app2"></div></div>
  </div>
  <script>
    const CHAPTERS = [
      {at:0, end:4.25, role:'ПРОДАВЕЦ', title:'Опубликовать аукцион', description:'Цена → шаг ставки → проверка → публикация'},
      {at:4.25, end:8.65, role:'ПОКУПАТЕЛЬ', title:'Посмотреть и сделать ставку', description:'Фото, ставка и уведомление, если её перебьют'},
      {at:8.65, end:10.8, role:'ПРОВЕРКА СУММЫ', title:'Проверить минимальную ставку', description:'При низкой сумме виден допустимый минимум'},
      {at:10.8, end:13, role:'ПОВТОРНАЯ ПОПЫТКА', title:'Повторить после ошибки', description:'Повторная отправка → проверка → ставка принята'},
      {at:13, end:15, role:'РЕЗУЛЬТАТ АУКЦИОНА', title:'Увидеть итог', description:'Финальная цена и следующий шаг для победителя'}
    ];
    const SCENES = [
      {at:0, key:'seller-form', step:'Стартовая цена и шаг ставки', number:'01 / 03', s:1.18, y:22},
      {at:1.37, key:'seller-review', step:'Проверка условий перед публикацией', number:'02 / 03', s:1.23, y:34},
      {at:2.77, key:'seller-published', step:'Квартира ждёт первых ставок', number:'03 / 03', s:1.28, y:100},
      {at:4.25, key:'buyer-active', step:'Квартира, текущая ставка и таймер', number:'01 / 03', s:1.27, y:-164},
      {at:4.86, key:'buyer-photo', step:'Просмотр фотографий квартиры', number:'01 / 03', s:1.27, y:-164},
      {at:5.17, key:'buyer-active', step:'Ставка 12 500 000 ₽', number:'01 / 03', s:1.27, y:-164},
      {at:6.03, key:'buyer-loading', step:'Проверка отправленной ставки', number:'02 / 03', s:1.27, y:-164},
      {at:6.73, key:'buyer-success', step:'Вы лидируете · уведомление включено', number:'03 / 03', s:1.27, y:-164},
      {at:7.87, key:'buyer-notification-off', step:'Управление уведомлением', number:'03 / 03', s:1.27, y:-164},
      {at:8.2, key:'buyer-success', step:'Ставка принята', number:'03 / 03', s:1.27, y:-164},
      {at:8.65, key:'buyer-low-input', step:'Сумма ниже допустимой', number:'01 / 02', s:1.33, y:-200},
      {at:9.28, key:'buyer-low', step:'Минимальная ставка — 12 500 000 ₽', number:'02 / 02', s:1.33, y:-200},
      {at:10.8, key:'buyer-error', step:'Ошибка отправки и кнопка повтора', number:'01 / 03', s:1.3, y:-184},
      {at:11.63, key:'buyer-retry', step:'Проверка повторной отправки', number:'02 / 03', s:1.3, y:-184},
      {at:12.24, key:'buyer-success', step:'Повторная отправка прошла успешно', number:'03 / 03', s:1.3, y:-184},
      {at:13, key:'buyer-finished', step:'Квартиру купили за 12 850 000 ₽', number:'ФИНАЛ', s:1.28, y:65}
    ];
    const ACTIONS = [
      {time:1.25, key:'seller-form', target:'review'},
      {time:2.65, key:'seller-review', target:'publish'},
      {time:4.76, key:'buyer-active', target:'next'},
      {time:5.91, key:'buyer-active', target:'submit'},
      {time:7.75, key:'buyer-success', target:'notification', checkbox:true},
      {time:8.08, key:'buyer-notification-off', target:'notification', checkbox:true, source:'buyer-success'},
      {time:9.16, key:'buyer-low-input', target:'submit'},
      {time:11.51, key:'buyer-error', target:'retry'}
    ];
    const sceneAt = time => SCENES.filter(scene => scene.at <= time + 1e-6).at(-1);
    const screenNodes = {};
    const chapterNodes = [];

    function draw(time, E) {
      const scene = sceneAt(time);
      const chapter = CHAPTERS.findIndex(item => time >= item.at && time < item.end);
      const active = chapter < 0 ? 4 : chapter;
      const age = time - scene.at;
      const entrance = scene.at === 0 ? 1 : E.eout(E.lin(age, 0, .22));
      for (const [key, node] of Object.entries(screenNodes)) {
        const on = key === scene.key;
        node.style.visibility = on ? 'visible' : 'hidden';
        const x = (692 - 440 * scene.s) / 2 + (on ? (1 - entrance) * 18 : 0);
        node.style.transform = `translate(${x}px,${scene.y}px) scale(${scene.s})`;
        node.style.opacity = on ? .35 + .65 * entrance : 0;
      }
      chapterNodes.forEach((node, i) => node.className = `chapter${i === active ? ' active' : (i < active ? ' done' : '')}`);
      E.$('phase').textContent = CHAPTERS[active].role;
      E.$('counter').textContent = `${String(active + 1).padStart(2,'0')} / 05`;
      E.$('step-title').textContent = scene.step;
      E.$('step-count').textContent = scene.number;
      E.$('progress').querySelectorAll('i').forEach((bar, i) => {
        bar.style.transform = `scaleX(${E.lin(Math.min(time,13.5), CHAPTERS[i].at, Math.min(CHAPTERS[i].end,13.5))})`;
      });
      document.querySelectorAll('.screen [class*="loader"]').forEach(loader => loader.style.transform = `rotate(${time * 450}deg)`);
      const action = ACTIONS.find(item => time >= item.time - .28 && time < item.time + .1);
      const focus = E.$('focus');
      if (action && !action.checkbox) {
        const source = PROTOTYPE[action.source || action.key].targets[action.target];
        const x = (692 - 440 * scene.s) / 2;
        E.css(focus, {left:`${x + source.x * scene.s - 3}px`,top:`${scene.y + source.y * scene.s - 3}px`,width:`${source.width * scene.s + 6}px`,height:`${source.height * scene.s + 6}px`,opacity:.75});
      } else focus.style.opacity = 0;
    }

    E.start({
      build(E) {
        for (const [key, data] of Object.entries(PROTOTYPE)) {
          const element = document.createElement('div');
          element.className = 'screen';
          element.dataset.screen = key;
          element.innerHTML = data.html;
          for (const [name, box] of Object.entries(data.targets)) {
            const target = document.createElement('span');
            target.id = `target-${key}-${name}`;
            target.className = 'target';
            target.style.cssText = `left:${box.x}px;top:${box.y}px;width:${box.width}px;height:${box.height}px`;
            element.appendChild(target);
          }
          E.$('screens').appendChild(element);
          screenNodes[key] = element;
        }
        CHAPTERS.forEach((chapter, i) => {
          const row = document.createElement('div'); row.className = 'chapter';
          row.innerHTML = `<span class="number">${String(i+1).padStart(2,'0')}</span><div><h2>${chapter.title}</h2><p>${chapter.description}</p></div>`;
          E.$('chapters').appendChild(row); chapterNodes.push(row);
          const bar = document.createElement('span'); bar.style.flex = chapter.end - chapter.at; bar.innerHTML = '<i></i>'; E.$('progress').appendChild(bar);
        });
      },
      setup(E) {
        E.camera([[0,960,540,1],[15,960,540,1]], [[0,960,540,1]]);
        const cursorKeys = [], checks = [];
        ACTIONS.forEach((action, i) => {
          E.measureAt(action.time);
          const actual = screenNodes[action.source || action.key].querySelector(`[data-motion-target="${action.target}"]`);
          const target = E.rect(actual);
          const x = action.checkbox ? target.x + 10 * sceneAt(action.time).s : target.cx;
          const y = target.cy;
          action.x = x; action.y = y;
          const before = Math.min(.36, i ? (action.time - ACTIONS[i-1].time) * .4 : .36);
          const after = Math.min(.13, i < ACTIONS.length-1 ? (ACTIONS[i+1].time - action.time) * .4 : .13);
          cursorKeys.push([action.time-before,x+46,y+36,0],[action.time-before*.72,x+32,y+24,1],[action.time-before*.28,x,y,1],[action.time,x,y,1],[action.time+after*.38,x,y,1],[action.time+after,x+12,y+16,0]);
          checks.push({time:action.time, screen:action.key, target:action.target, x, y, bounds:target});
        });
        // Closely spaced notification toggles share a stationary pointer.
        const ordered = cursorKeys.sort((a,b) => a[0]-b[0]);
        E.cursor(ordered); E.clicks(ACTIONS.map(action => action.time));
        window.CURSOR_CHECKS = checks;
        window.SCENE_TIMELINE = SCENES;
      },
      scene:draw
    });
  </script>
</body>
</html>
